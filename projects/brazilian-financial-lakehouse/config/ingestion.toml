# Raw ingestion settings per environment. Public APIs: no credentials are needed.

[local]
landing_root = "data/landing/financial"
bronze_root = "data/bronze/financial"        # LocalBronzeSink (JSON Lines)
observability_root = "data/observability/financial"   # pipeline_runs / data_quality_results
backfill_start = 2015-01-01
lookback_days = 90
lookback_periods = 6
timeout_seconds = 30.0
max_attempts = 5
max_response_bytes = 33554432   # 32 MiB, received or decoded body

[databricks]
# Outbound internet access from Free Edition is not confirmed (docs/data_sources.md §3).
landing_root = "/Volumes/financial/landing/files"
bronze_table = "financial.bronze.bronze_indicator_observations"   # DeltaBronzeSink
backfill_start = 2015-01-01
lookback_days = 90
lookback_periods = 6
timeout_seconds = 30.0
max_attempts = 5
max_response_bytes = 33554432   # 32 MiB, received or decoded body

[smoke]
# Databricks smoke test: isolated from [databricks]; a short history keeps the API calls few
# (one window per indicator). Replay fallback: docs/databricks/DEPLOYMENT_GUIDE.md.
landing_root = "/Volumes/workspace/smoke_financial/landing"
bronze_table = "workspace.smoke_financial_bronze.bronze_indicator_observations"
backfill_start = 2025-01-01
lookback_days = 30
lookback_periods = 2
timeout_seconds = 30.0
max_attempts = 3
max_response_bytes = 33554432   # 32 MiB, received or decoded body
