# Install stage shared by every CI job: Python 3.12, optional Java 21 (Spark), `make install`.
name: setup
description: Python (+ Java for Spark jobs) and the dev environment via `make install`.
inputs:
  java:
    description: "true for jobs that start Spark (transformation, data quality, integration)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements/dev.lock.txt
    - if: inputs.java == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - if: inputs.java == 'true'
      uses: actions/cache@v4  # Delta JARs resolved by Ivy on first Spark+Delta session
      with:
        path: ~/.ivy2
        key: ivy-delta-${{ hashFiles('pyproject.toml') }}
    - name: make install
      shell: bash
      run: make install
